services:
  - type: web
    name: habituate-api
    env: node
    plan: free
    rootDir: api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
  - type: static
    name: habituate-web
    env: static
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build:web
    publishDir: web-build
